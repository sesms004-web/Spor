<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozuk Hesap Makinesi</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1e1e1e;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 260px;
            text-align: center;
        }
        #display {
            width: 100%;
            height: 60px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 15px;
            background: #9cad88;
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        /* Kilitlendiğinde devreye giren stil */
        .locked-text {
            color: #d32f2f !important;
            text-align: center !important;
            font-size: 32px !important;
            background: #ffcccc !important;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 15px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background: #444;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px #222;
            transition: 0.1s;
        }
        button:active {
            box-shadow: 0 0 #222;
            transform: translateY(4px);
        }
        button:hover {
            background: #555;
        }
        /* Tuşlar kilitlendiğinde uygulanacak stil */
        button:disabled {
            background: #333;
            color: #555;
            box-shadow: none;
            transform: translateY(4px);
            cursor: not-allowed;
        }
        .operator {
            background: #ff9800;
            box-shadow: 0 4px #e65100;
        }
        .operator:hover {
            background: #fb8c00;
        }
        .clear {
            background: #f44336;
            box-shadow: 0 4px #b71c1c;
        }
        .clear:hover {
            background: #e53935;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" disabled value="">
        <div class="buttons">
            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button class="operator" onclick="appendOp('/')">/</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button class="operator" onclick="appendOp('*')">*</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button class="operator" onclick="appendOp('-')">-</button>

            <button class="clear" onclick="clearDisp()">C</button>
            <button onclick="appendNum('0')">0</button>
            <button class="operator" onclick="calculate()">=</button>
            <button class="operator" onclick="appendOp('+')">+</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let isLocked = false;

        function appendNum(num) {
            if(isLocked) return;
            display.value += num;
            checkSecret();
        }

        function appendOp(op) {
            if(isLocked) return;
            display.value += op;
            checkSecret();
        }

        function clearDisp() {
            if(isLocked) return;
            display.value = '';
        }

        function calculate() {
            if(isLocked) return;
            try {
                // Basit ve eksik bir hesaplama mantığı (istediğin gibi tam değil)
                display.value = eval(display.value);
                checkSecret();
            } catch(e) {
                display.value = 'Hata';
            }
        }

        function checkSecret() {
            // Ekranda 31 gördüğü an anında değiştirir ve kilitler
            if (display.value.includes('31')) {
                isLocked = true;

                // 31'i yarrak ile değiştir ve kilit ekranını ver
                display.value = display.value.replace(/31/g, 'yarrak');
                display.classList.add('locked-text');

                // Bütün tuşları kilitle/devre dışı bırak
                let btns = document.querySelectorAll('button');
                btns.forEach(btn => {
                    btn.disabled = true;
                });
            }
        }
    </script>
</body>
</html>
